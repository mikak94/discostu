[project]
name = "discostu-train"
version = "0.1.0"
description = "Training for discostu's zero-latency noise suppressor"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.8", "numpy", "soundfile", "scipy"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
