[package]
name = "discostu"
version.workspace = true
edition.workspace = true
description = "Peer-to-peer voice + screen sharing with sub-millisecond transport latency"

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "canvas", "wgpu", "advanced", "tokio"] }
cpal = { version = "0.18", features = ["asio"] }
xcap = "0.9"
lz4_flex = "0.14"
realfft = "3.5"
rtrb = "0.4"
rayon = "1.12"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
serde.workspace = true
serde_json = "1"
postcard.workspace = true
discostu-proto.workspace = true
quinn.workspace = true
tokio.workspace = true
bytes = "1"
igd-next = { version = "0.16", features = ["aio_tokio"] }
crab_nat = "0.8"
netdev = "0.40"
directories = "6"
crossbeam-channel = "0.5"
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bytemuck = { version = "1", features = ["derive"] }
thread-priority = "3"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media", "Win32_System_LibraryLoader"] }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
resvg = "0.45"
